name: Deploy to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no root@185.50.38.104 << 'EOF'
            cd /srv/ariasakht
            git pull origin master
            
            if [ -f mongo_6_0.tar ]; then
              docker load -i mongo_6_0.tar
            fi
            if [ -f node_20_alpine.tar ]; then
              docker load -i node_20_alpine.tar
            fi
            if [ -f nginx_alpine.tar ]; then
              docker load -i nginx_alpine.tar
            fi

            docker-compose -f docker-compose.production.yml down
            docker-compose -f docker-compose.production.yml up -d --build
          EOF
