name: Deploy to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -H 185.50.38.104 >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh root@185.50.38.104 << 'EOF'
            set -e
            cd /srv/ariasakht
            
            # چک کردن فضای دیسک
            DISK_USAGE=$(df -h / | awk 'NR==2 {print $5}' | cut -d'%' -f1)
            if [ "$DISK_USAGE" -gt 65 ]; then
              echo "Disk usage is over 65% ($DISK_USAGE%). Pruning Docker..."
              docker system prune -f --volumes
            else
              echo "Disk usage is $DISK_USAGE%, no pruning needed."
            fi
            
            # ادامه فرآیند deployment
            git fetch origin
            git reset --hard origin/master

            for IMAGE in mongo_6_0 node_20_alpine nginx_alpine; do
              if [ -f ${IMAGE}.tar ]; then
                docker load -i ${IMAGE}.tar
              fi
            done

            docker-compose -f docker-compose.production.yml down --remove-orphans
            docker-compose -f docker-compose.production.yml up -d --build
          EOF