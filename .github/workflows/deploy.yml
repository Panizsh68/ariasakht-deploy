name: Deploy to Production

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate deployment inputs
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test "$SSH_USER" != root
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add server to known_hosts
        run: ssh-keyscan -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"
      - name: Deploy without destructive cleanup
        run: |
          set -euo pipefail
          ssh "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            cd /srv/tejaris

            on_failure() {
              printf '\nDeployment failed; persistent volumes were not removed.\n' >&2
              docker compose --env-file production.env -f docker-compose.production.yml ps || true
            }
            trap on_failure ERR

            test -f production.env
            test -f pre-shantia/.env.production
            test -f pre-shantia-front/.env.production
            test -f "$(grep '^MONGO_KEYFILE_PATH=' production.env | cut -d= -f2-)"
            git diff --quiet && git diff --cached --quiet
            previous_commit=$(git rev-parse HEAD)
            git fetch origin master
            git merge --ff-only origin/master

            docker compose --env-file production.env -f docker-compose.production.yml config >/dev/null
            docker compose --env-file production.env -f docker-compose.production.yml up -d --build --remove-orphans

            for attempt in $(seq 1 30); do
              health=$(docker inspect --format '{{.State.Health.Status}}' backend 2>/dev/null || true)
              if [ "$health" = healthy ]; then
                printf 'Deployment healthy at %s (previous %s)\n' "$(git rev-parse HEAD)" "$previous_commit"
                exit 0
              fi
              sleep 10
            done
            printf 'Backend health check did not become healthy. Previous commit was %s.\n' "$previous_commit" >&2
            exit 1
          REMOTE
