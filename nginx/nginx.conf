user        nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout 65;

    # gzip
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        application/font-woff2
        image/svg+xml;

    # SSL session cache
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # rate-limit zone
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/m;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name ariasakht.com www.ariasakht.com;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name ariasakht.com www.ariasakht.com;

        ssl_certificate     /etc/letsencrypt/live/ariasakht.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ariasakht.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # 1) Swagger UI
        location /docs/ {
            proxy_pass         http://backend:3000/docs/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # 2) API with CORS & rate-limit
        location /api/ {
            limit_req zone=api_zone burst=5 nodelay;

            proxy_pass         http://backend:3000/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # 3) All other → Nuxt SSR
        location / {
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }
}
