services:
  mongo-primary:
    image: mongo:4.4
    container_name: mongo-primary
    command: >
      mongod --replSet rs0 --keyFile /run/secrets/mongodb-keyfile
      --bind_ip_all --auth --wiredTigerCacheSizeGB 1
    volumes:
      - mongo-primary-data:/data/db
      - ${MONGO_KEYFILE_PATH:?MONGO_KEYFILE_PATH must point to a runtime-mounted secret}:/run/secrets/mongodb-keyfile:ro
      - ./mongo/mongod.conf:/etc/mongod.conf:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet --host 127.0.0.1 --username=$$MONGO_INITDB_ROOT_USERNAME --password=$$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase=admin --eval=\"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1.2G
    networks: [app-network]

  mongo-secondary-1:
    image: mongo:4.4
    container_name: mongo-secondary-1
    command: >
      mongod --replSet rs0 --keyFile /run/secrets/mongodb-keyfile
      --bind_ip_all --auth --wiredTigerCacheSizeGB 1
    volumes:
      - mongo-secondary-1-data:/data/db
      - ${MONGO_KEYFILE_PATH:?MONGO_KEYFILE_PATH must point to a runtime-mounted secret}:/run/secrets/mongodb-keyfile:ro
    deploy:
      resources:
        limits:
          memory: 1G
    networks: [app-network]

  mongo-secondary-2:
    image: mongo:4.4
    container_name: mongo-secondary-2
    command: >
      mongod --replSet rs0 --keyFile /run/secrets/mongodb-keyfile
      --bind_ip_all --auth --wiredTigerCacheSizeGB 1
    volumes:
      - mongo-secondary-2-data:/data/db
      - ${MONGO_KEYFILE_PATH:?MONGO_KEYFILE_PATH must point to a runtime-mounted secret}:/run/secrets/mongodb-keyfile:ro
    deploy:
      resources:
        limits:
          memory: 1G
    networks: [app-network]

  mongo-init:
    image: mongo:4.4
    container_name: mongo-init
    depends_on:
      mongo-primary:
        condition: service_healthy
      mongo-secondary-1:
        condition: service_started
      mongo-secondary-2:
        condition: service_started
    volumes:
      - ./mongo-init/init-replica.sh:/init-replica.sh:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
    entrypoint: ["bash", "/init-replica.sh"]
    restart: "no"
    networks: [app-network]

  redis:
    image: redis:7
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    networks: [app-network]

  backend:
    container_name: backend
    build:
      context: ./pre-shantia
      dockerfile: Dockerfile
    env_file: [./pre-shantia/.env.production]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    networks: [app-network]

  frontend:
    container_name: frontend
    build:
      context: ./pre-shantia-front
      dockerfile: Dockerfile
    env_file: [./pre-shantia-front/.env.production]
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    networks: [app-network]

  nginx:
    image: nginx:1.25.0
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/ssl/tejaris:/etc/ssl/tejaris:ro
    depends_on: [backend, frontend]
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    networks: [app-network]

volumes:
  mongo-primary-data:
  mongo-secondary-1-data:
  mongo-secondary-2-data:
  redis-data:

networks:
  app-network:
    driver: bridge
